<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Describer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="shell">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-brand">
        <img class="brand-mark" src="icons/icon32.png" width="26" height="26" alt="" />
        <span class="brand-name">AI Image Describer</span>
      </div>
      <button class="topbar-close" id="btn-close-popup" type="button" aria-label="Close popup">&times;</button>
    </header>

    <div class="shell-body">

    <!-- ── EMPTY STATE ── -->
    <section id="state-empty" class="panel active">
      <div
        class="dropzone"
        id="dropzone"
        tabindex="0"
        aria-label="Drop an image here, choose file, or paste from clipboard"
      >
        <p class="dropzone-title">Drop an image or paste from clipboard</p>
        <p class="dropzone-hint">JPG or PNG, up to 10 MB</p>
        <button class="btn btn-primary btn-inline" id="btn-choose-file" type="button">Choose file</button>
      </div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden />

      <button class="btn btn-secondary btn-full" id="btn-open-site" type="button" title="Resize and analyze on imageprompt.tools in a new tab">
        On imageprompt.tools
      </button>

      <div id="empty-notice" class="empty-notice" role="status" hidden></div>

      <div class="field-row">
        <label class="field-label" for="style-select">Style preset</label>
        <select class="field-select" id="style-select">
          <option value="photoreal">Photo-real</option>
          <option value="midjourney">Midjourney</option>
          <option value="sd">Stable Diffusion</option>
          <option value="flux">Flux</option>
        </select>
      </div>

      <p class="paste-hint">Paste a picture with ⌘V / Ctrl+V, or drop a file.</p>
    </section>

    <!-- ── LOADING STATE ── -->
    <section id="state-loading" class="panel" aria-busy="true">
      <div class="preview-frame preview-frame-loading" aria-hidden="true">
        <div class="preview-frame-inner">
          <img id="loading-preview" class="preview-img" src="" alt="" />
        </div>
      </div>
      <div class="loading-block">
        <p class="loading-text">Analyzing image…</p>
        <div class="loading-bar-wrap">
          <div class="loading-bar-fill"></div>
        </div>
      </div>
    </section>

    <!-- ── RESULT STATE ── -->
    <section id="state-result" class="panel panel-result">
      <div class="preview-frame preview-frame-result" aria-hidden="true">
        <div class="result-actions" role="group" aria-label="Prompt actions">
          <button class="btn btn-overlay btn-overlay-primary" id="btn-copy" type="button">Copy</button>
          <button class="btn btn-overlay" id="btn-open-history-site" type="button" title="Full history lives on imageprompt.tools">
            History
          </button>
          <button class="btn btn-overlay" id="btn-retry" type="button">Another</button>
        </div>
        <div class="preview-frame-inner">
          <img id="result-preview" class="preview-img" src="" alt="" />
        </div>
      </div>

      <div id="error-banner" class="error-banner" role="alert" hidden></div>

      <div class="prompt-box-wrap">
        <div class="result-header">
          <span class="result-title">Prompt</span>
        </div>
        <pre id="prompt-box" class="prompt-box" tabindex="0"></pre>
      </div>
    </section>

    <!-- ── ERROR STATE (fetch failed before result) ── -->
    <section id="state-error" class="panel">
      <div class="error-full">
        <p id="error-message" class="error-message"></p>
        <button class="btn btn-primary btn-full" id="btn-error-retry" type="button">Try another image</button>
      </div>
    </section>

    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
