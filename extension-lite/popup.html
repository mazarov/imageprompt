<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ai Image Describer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="shell">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">P</span>
        <span class="brand-name">Ai Image Describer</span>
      </div>
    </header>

    <!-- ── EMPTY STATE ── -->
    <section id="state-empty" class="panel active">
      <div
        class="dropzone"
        id="dropzone"
        role="button"
        tabindex="0"
        aria-label="Drop an image here or click to choose a file"
      >
        <svg class="dropzone-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="4" width="40" height="40" rx="8" stroke="currentColor" stroke-width="2"/>
          <path d="M24 16v16M16 24h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M10 34l8-8 5 5 5-6 10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
        </svg>
        <p class="dropzone-title">Drop an image or paste from clipboard</p>
        <p class="dropzone-hint">JPG or PNG, up to 10 MB</p>
      </div>

      <div class="actions-row">
        <button class="btn btn-secondary" id="btn-choose-file" type="button">Choose file</button>
        <button class="btn btn-secondary" id="btn-open-site" type="button" title="Resize and analyze on imageprompt.tools in a new tab">
          On imageprompt.tools
        </button>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden />
      </div>

      <div id="empty-notice" class="empty-notice" role="status" hidden></div>

      <div class="field-row">
        <label class="field-label" for="style-select">Style preset</label>
        <select class="field-select" id="style-select">
          <option value="photoreal">Photo-real</option>
          <option value="midjourney">Midjourney</option>
          <option value="sd">Stable Diffusion</option>
          <option value="flux">Flux</option>
        </select>
      </div>
    </section>

    <!-- ── LOADING STATE ── -->
    <section id="state-loading" class="panel">
      <div class="preview-wrap">
        <img id="loading-preview" class="preview-img" src="" alt="Image being analyzed" />
      </div>
      <div class="loading-status">
        <span class="spinner" aria-hidden="true"></span>
        <span class="loading-text">Analyzing image...</span>
      </div>
    </section>

    <!-- ── RESULT STATE ── -->
    <section id="state-result" class="panel">
      <div class="preview-wrap">
        <img id="result-preview" class="preview-img" src="" alt="Analyzed image" />
      </div>
      <div class="result-header">
        <span class="result-title">Prompt</span>
      </div>
      <pre id="prompt-box" class="prompt-box" tabindex="0"></pre>
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <div class="result-actions">
        <button class="btn btn-primary" id="btn-copy" type="button">Copy prompt</button>
        <button class="btn btn-secondary" id="btn-open-history-site" type="button" title="Full history lives on imageprompt.tools">
          Open recognition history…
        </button>
        <button class="btn btn-secondary" id="btn-retry" type="button">Try another image</button>
      </div>
    </section>

    <!-- ── ERROR STATE (fetch failed before result) ── -->
    <section id="state-error" class="panel">
      <div class="error-full">
        <p id="error-message" class="error-message"></p>
        <button class="btn btn-secondary" id="btn-error-retry" type="button">Try another image</button>
      </div>
    </section>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
