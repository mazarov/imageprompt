<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" fill="none">
  <defs>
    <linearGradient id="liteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <!-- clip synced with thumbnail rect inside hero card -->
    <clipPath id="thumbClip">
      <rect x="-112" y="-40" width="92" height="70" rx="10" ry="10"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="glowSpark" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#liteBg)"/>
  <rect width="440" height="280" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- Lite capsule -->
  <g transform="translate(292,26)">
    <rect width="114" height="30" rx="15" ry="15" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <text x="57" y="20.5" text-anchor="middle" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.08em">LITE</text>
  </g>

  <!-- Center: thumbnail -> caption -->
  <g transform="translate(220,130)" filter="url(#softShadow)">
    <rect x="-130" y="-54" width="260" height="108" rx="18" ry="18" fill="#ffffff" opacity="0.97"/>

    <!-- Thumbnail -->
    <rect x="-112" y="-40" width="92" height="70" rx="10" ry="10" fill="#0f172a"/>
    <g clip-path="url(#thumbClip)">
      <rect x="-112" y="-40" width="92" height="70" fill="#082f49"/>
      <circle cx="-66" cy="-18" r="12" fill="#fbbf24"/>
      <path d="M-112 30 L-74 -14 L-52 14 L-24 -24 L -20 30 Z" fill="#14532d"/>
      <path d="M-112 30 L-54 -26 L-20 30 Z" fill="#22c55e" opacity="0.75"/>
    </g>

    <!-- Arrow -->
    <path d="M -8 14 L22 14 L22 -2 L48 26 L22 54 L22 38 L -8 38 Z" fill="#eef2ff" opacity="0.98"/>

    <!-- Caption bubble -->
    <path d="M 28 -42 H 126 A 14 14 0 0 1 140 -28 V 22 A 14 14 0 0 1 126 36 H 60 L 52 54 L 48 38 H 28 A 14 14 0 0 1 14 22 V -28 A 14 14 0 0 1 28 -42 Z"
          fill="#7dd3fc" opacity="0.98"/>
    <path d="M 28 -42 H 126 A 14 14 0 0 1 140 -28 V 22 A 14 14 0 0 1 126 36 H 60 L 52 54 L 48 38 H 28 A 14 14 0 0 1 14 22 V -28 A 14 14 0 0 1 28 -42 Z"
          fill="none" stroke="#0f172a" stroke-opacity="0.18" stroke-width="2"/>

    <!-- Caption lines hint -->
    <rect x="40" y="-18" width="88" height="8" rx="4" fill="#0f172a" opacity="0.55"/>
    <rect x="40" y="-2" width="76" height="8" rx="4" fill="#0f172a" opacity="0.42"/>
    <rect x="40" y="14" width="62" height="8" rx="4" fill="#0f172a" opacity="0.3"/>

    <!-- AI spark cues -->
    <g fill="#fde047" opacity="0.95" transform="translate(124,-36) rotate(12)" filter="url(#glowSpark)">
      <path d="M0 -8 L2 2 L14 4 L2 8 L0 18 L -2 8 L-14 4 L -2 2 Z"/>
      <path transform="translate(-28,28) scale(0.55)" d="M0 -8 L2 2 L14 4 L2 8 L0 18 L -2 8 L-14 4 L -2 2 Z"/>
    </g>
  </g>

  <!-- Minimal headline -->
  <text x="220" y="228" text-anchor="middle" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">
    IMAGE &#8594; PROMPT
  </text>
  <text x="220" y="251" text-anchor="middle" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="600" fill="rgba(248,250,252,0.74)" letter-spacing="0.18em">
    AI IMAGE DESCRIBER
  </text>
</svg>
